<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="128" y2="128">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- 简历/文件图标 -->
  <rect x="30" y="22" width="50" height="60" rx="6" fill="white" fill-opacity="0.95"/>
  <!-- 文件折角 -->
  <path d="M70 22L70 38L80 38L80 22" fill="#e8e8e8"/>
  <path d="M70 22L70 38L80 38" fill="none" stroke="#d0d0d0" stroke-width="1"/>

  <!-- 文件内的线条（模拟文字） -->
  <rect x="38" y="46" width="30" height="4" rx="2" fill="#3a7bd5" opacity="0.6"/>
  <rect x="38" y="54" width="22" height="3" rx="1.5" fill="#3a7bd5" opacity="0.4"/>
  <rect x="38" y="61" width="26" height="3" rx="1.5" fill="#3a7bd5" opacity="0.4"/>
  <rect x="38" y="68" width="18" height="3" rx="1.5" fill="#3a7bd5" opacity="0.4"/>

  <!-- 放大镜 -->
  <circle cx="84" cy="78" r="16" stroke="url(#accent)" stroke-width="4" fill="none"/>
  <line x1="95" y1="89" x2="105" y2="99" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <!-- AI 星光点 -->
  <circle cx="44" cy="34" r="2" fill="#00d2ff">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="28" r="2" fill="#00d2ff">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- 标题 -->
  <text x="64" y="113" text-anchor="middle" fill="white" font-size="11" font-weight="bold" font-family="Arial, sans-serif" letter-spacing="2">BOSS助手</text>
</svg>
