<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>BOSS直聘助手</title>
  <link rel="stylesheet" href="styles.css">
  <script src="prompts.js"></script>
  <style>
    body {
      width: 320px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
    }

    .error-container {
      display: none;
      background: #fff2f0;
      border: 1px solid #ffccc7;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 4px;
      color: #ff4d4f;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
    }

    .error-container.show {
      display: block;
    }

    .error-container .close-btn {
      position: absolute;
      right: 8px;
      top: 8px;
      cursor: pointer;
      color: #ff7875;
      font-size: 12px;
    }

    .settings-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      font-weight: 500;
      color: #333;
      font-size: 14px;
    }

    .tooltip {
      color: #8c8c8c;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
      padding: 8px 12px;
      background: #f5f7fa;
      border-radius: 4px;
      border-left: 3px solid #1677ff;
    }

    input[type="text"],
    input[type="number"],
    input[type="password"],
    textarea {
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      outline: none;
      border-color: #1677ff;
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
    }

    input[type="number"] {
      width: 100px;
    }

    textarea {
      height: 100px;
      resize: vertical;
      font-family: inherit;
    }

    #customSystemPrompt {
      width: 100%;
      min-height: 120px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.5;
      resize: vertical;
    }

    .save-btn {
      background-color: #1677ff;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .save-btn:hover {
      background-color: #4096ff;
      transform: translateY(-1px);
    }

    .save-btn:active {
      transform: translateY(0);
    }

    .status {
      margin-top: 10px;
      padding: 8px;
      border-radius: 4px;
      display: none;
    }

    .status.success {
      display: block;
      background-color: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #222edc;
    }

    .status.error {
      display: block;
      background-color: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .start-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background-color: #06b95d;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }

    .start-btn:hover {
      background-color: #40a9ff;
    }

    .small-select {
      padding: 4px 8px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 12px;
      background: white;
      cursor: pointer;
    }

    .test-btn {
      background: #52c41a;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .test-btn:hover {
      background: #73d13d;
    }

    .test-btn:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }

    .test-result {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
    }

    .test-result.success {
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #52c41a;
    }

    .test-result.error {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
    }

    .setting-tip {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 8px 12px;
      background: #fffbe6;
      border: 1px solid #ffe58f;
      border-radius: 6px;
      font-size: 12px;
      color: #8c8c8c;
      line-height: 1.5;
    }

    .setting-tip i {
      flex-shrink: 0;
    }
  </style>
</head>

<body>
  <div id="errorContainer" class="error-container">
    <span id="errorMessage"></span>
    <span class="close-btn" onclick="this.parentElement.classList.remove('show')">✕</span>
  </div>

  <div class="settings-container">
    <div class="setting-item">
      <div class="setting-header">
        <label for="customSystemPrompt">系统提示词</label>
        <select id="promptTemplateSelect" class="small-select">
          <option value="">选择模板...</option>
          <option value="default">通用模板</option>
          <option value="strict">严格模式</option>
          <option value="tech">技术岗位</option>
          <option value="sales">销售岗位</option>
          <option value="product">产品经理</option>
        </select>
      </div>
      <textarea id="customSystemPrompt" rows="8" placeholder="输入系统提示词，用于指导 AI 如何评估简历..."></textarea>
      <div class="tooltip" style="font-size:11px; padding:6px 10px;">
        提示词仅供 AI 评估参考，可修改后点击"保存设置"生效
      </div>
    </div>

    <!-- 搜索设置 -->
    <div class="setting-item">
      <div class="setting-header">
        <label>搜索设置</label>
      </div>
      <label class="checkbox-label" style="margin-top:8px;">
        <input type="checkbox" id="filterRead" checked>
        <span>过滤已读简历</span>
      </label>
      <div class="tooltip" style="font-size:11px; padding:6px 10px;">
        开启后跳过已浏览过的灰色简历，避免重复分析
      </div>
    </div>

    <!-- 评分设置 -->
    <div class="setting-item">
      <div class="setting-header">
        <label for="scoreThreshold">评分阈值</label>
      </div>
      <input type="number" id="scoreThreshold" min="0" max="100" value="80">
      <div class="tooltip">
        当简历评分高于阈值时，系统将自动触发以下动作
      </div>
    </div>

    <div class="setting-item">
      <div class="setting-header">
        <label>阈值触发动作</label>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px;">
        <label class="checkbox-label">
          <input type="checkbox" id="autoFavorite" checked>
          <span>自动收藏</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="autoGreet">
          <span>自动联系Ta</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="autoShare" checked>
          <span>自动转发至邮箱</span>
        </label>
        <div id="forwardEmailRow" style="display:none; margin-left:24px;">
          <input type="text" id="forwardEmail" placeholder="hr@company.com" style="width:200px; font-size:12px;">
        </div>
        <label class="checkbox-label" style="margin-top:6px;">
          <input type="checkbox" id="captureUnqualifiedCard">
          <span>未达标仍获取分享卡片</span>
        </label>
        <div class="tooltip" style="font-size:11px; margin-top:2px; padding:6px 10px;">
          勾选后即使简历未达标也会获取分享卡片（会占用每日分享数量额度）
        </div>
        </label>
      </div>
    </div>

    <div id="proActivation" class="setting-item" style="display:none;">
      <div class="setting-header"><label>Pro 激活码</label></div>
      <div style="display:flex; gap:8px; margin-top:4px;">
        <input type="text" id="activateCode" placeholder="输入激活码" style="flex:1;">
        <button id="activateBtn" style="padding:6px 12px; background:#06b95d; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px;">激活</button>
      </div>
      <div id="activateMsg" style="font-size:12px; margin-top:4px;"></div>
      <div class="tooltip" style="font-size:11px; padding:6px 10px;">联系微信 kkclubwx 获取激活码</div>
    </div>

    <div id="status" class="status"></div>
    <button class="save-btn" id="saveSettings">保存设置</button>
    <button class="start-btn" id="startNow">立即开始</button>
  </div>
  <script src="popup.js"></script>
</body>

</html>
